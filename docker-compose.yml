services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_ENV=${APP_ENV:-development}
      - APP_ORIGINS=${APP_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - PRIVACY_CONTROLLER=${PRIVACY_CONTROLLER:-}
      - PRIVACY_CONTACT=${PRIVACY_CONTACT:-}
      - PRIVACY_ADDRESS=${PRIVACY_ADDRESS:-}
      - PRIVACY_HOSTING_PROVIDER=${PRIVACY_HOSTING_PROVIDER:-}
      - PRIVACY_HOSTING_COUNTRY=${PRIVACY_HOSTING_COUNTRY:-}
      - PRIVACY_AUTHORITY=${PRIVACY_AUTHORITY:-}
      - PRIVACY_BACKUP_POLICY=${PRIVACY_BACKUP_POLICY:-}
      - PRIVACY_LOG_POLICY=${PRIVACY_LOG_POLICY:-}
      - PRIVACY_MAIL_PROVIDER=${PRIVACY_MAIL_PROVIDER:-}
      - PRIVACY_MAIL_RETENTION=${PRIVACY_MAIL_RETENTION:-}
      - PRIVACY_REVIEWED=${PRIVACY_REVIEWED:-false}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-90}
      - REQUIRE_INSTITUTIONAL_EMAIL=${REQUIRE_INSTITUTIONAL_EMAIL:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    volumes:
      - app_data:/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
