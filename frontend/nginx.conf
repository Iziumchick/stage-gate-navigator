limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    client_body_timeout 20s;
    limit_conn connections 20;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        limit_req zone=api_requests burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Robots-Tag;
        proxy_read_timeout 45s;
    }
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
